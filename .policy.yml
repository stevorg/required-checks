policy:
  approval:
    - test passed
    - no test required

approval_rules:
  - name: test passed
    requires:
      conditions:
        has_status:
          conclusions: ["success", "skipped"]
          statuses:
            - "build-test-release (component-a)"
            - "build-test-release (component-b)"
    if:
      changed_files: &test_required_files
        paths:
          - "^.github/workflows/ci.yaml"
          - "^component-a/.*"
          - "^component-b/.*"

  - name: no test required
    if:
      no_changed_files: *test_required_files
