policy:
  approval:
    and:
      - tests passed
      - dummy rule

approval_rules:
  - name: tests passed
    if:
      has_status:
        conclusions: ["success", "skipped"]
        statuses:
          - "build-test-release (component-a)"
          - "build-test-release (component-b)"
  - name: dummy rule
    requires:
      count: 0
