on:
  pull_request:

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - component-a
          - component-b
    steps:
      - name: Fake test
        run: |
          ./${{ env.COMPONENT }}/src.sh
        env:
          COMPONENT: ${{ matrix.component }}
